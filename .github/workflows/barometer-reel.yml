# 组合晴雨表 · 渲染 PNG + 20 秒 MP4
# 触发：n8n 发 repository_dispatch（event_type: barometer），payload 见 README
name: barometer-reel

on:
  repository_dispatch:
    types: [barometer]
  workflow_dispatch:        # 手动跑一次 = 用示例数据测试

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/barometer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chromium, ffmpeg, CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Write payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json, os
          p = json.loads(os.environ.get("PAYLOAD") or "null") or {}
          if p.get("barometer"):
              json.dump(p["barometer"], open("data.json", "w", encoding="utf-8"), ensure_ascii=False)
              open("obs.txt", "w", encoding="utf-8").write(p.get("observation", ""))
              open("disc.txt", "w", encoding="utf-8").write("教育分享 · 非投资建议")
          else:   # 手动测试：示例数据
              import shutil; shutil.copy("sample-output.json", "data.json")
              open("obs.txt", "w", encoding="utf-8").write("进攻抽屉遇雷暴，长寿抽屉却放晴——这正是把四个抽屉分开放的意义：风雨只打湿其中一格。")
              open("disc.txt", "w", encoding="utf-8").write("教育分享 · 非投资建议 · 示例数据")
          PY

      - name: Render
        run: python render.py --data data.json --obs "$(cat obs.txt)" --disc "$(cat disc.txt)" --out out

      - uses: actions/upload-artifact@v4
        with:
          name: barometer-reel
          path: tools/barometer/out/
          retention-days: 30
